<script>
// Interactive multiple-choice questions on practice pages. Progressive
// enhancement: without JavaScript the page shows the plain option list and
// the collapsible solution, unchanged. With it, each div.mcq (authored as
// ::: {.mcq answer="c"} in the .qmd) gets real radio or checkbox inputs and
// a single check button that replaces the Solution disclosure: the button
// carries the same triangle marker, and a correct answer reveals the
// solution text beneath the role="status" feedback line, flipping the
// triangle down. Native form controls keep this keyboard-operable.
(function () {
  'use strict';

  function enhance(box, idx) {
    var answers = (box.getAttribute('data-answer') || '')
      .toLowerCase().split(',')
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
    var list = box.querySelector('ol');
    if (!answers.length || !list) return;

    var multi = answers.length > 1;
    var name = 'mcq-' + idx;

    // Group the options in a fieldset named by the question paragraph.
    var q = box.querySelector('p');
    var fs = document.createElement('fieldset');
    fs.className = 'mcq-options';
    if (q) {
      if (!q.id) { q.id = name + '-q'; }
      fs.setAttribute('aria-labelledby', q.id);
    }
    list.parentNode.insertBefore(fs, list);
    fs.appendChild(list);

    // Each option becomes a label laid out as a three-column grid: letter,
    // input, text. The grid keeps wrapped lines of long options aligned
    // under the text column (the native ol marker misplaces itself on
    // multi-line items, so the letter is ours and the marker is dropped by
    // CSS). A label may not contain a <p>, so for loose lists move the
    // paragraph's children instead.
    Array.prototype.forEach.call(list.children, function (li, i) {
      var src = (li.children.length === 1 &&
                 li.firstElementChild.tagName === 'P')
        ? li.firstElementChild : li;
      var letter = document.createElement('span');
      letter.className = 'mcq-letter';
      letter.textContent = String.fromCharCode(97 + i) + '.';
      var input = document.createElement('input');
      input.type = multi ? 'checkbox' : 'radio';
      input.name = name;
      input.value = String.fromCharCode(97 + i);
      var text = document.createElement('span');
      text.className = 'mcq-text';
      while (src.firstChild) { text.appendChild(src.firstChild); }
      if (src !== li) { li.removeChild(src); }
      var label = document.createElement('label');
      label.appendChild(letter);
      label.appendChild(input);
      label.appendChild(text);
      li.appendChild(label);
    });

    // The Solution disclosure is absorbed: its body becomes a hidden panel
    // revealed on a correct answer, and the details element goes away.
    var sol = null;
    var det = box.querySelector('details.solution');
    if (det) {
      sol = document.createElement('div');
      sol.className = 'mcq-solution';
      sol.hidden = true;
      var sum = det.querySelector('summary');
      if (sum) { det.removeChild(sum); }
      while (det.firstChild) { sol.appendChild(det.firstChild); }
      det.parentNode.removeChild(det);
    }

    var controls = document.createElement('div');
    controls.className = 'mcq-controls';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mcq-check';
    var arrow = document.createElement('span');
    arrow.className = 'mcq-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '▸';
    btn.appendChild(arrow);
    btn.appendChild(document.createTextNode(
      ' ' + (multi ? 'Check my answers' : 'Check my answer')));
    var fb = document.createElement('p');
    fb.className = 'mcq-feedback';
    fb.setAttribute('role', 'status');
    controls.appendChild(btn);
    controls.appendChild(fb);
    if (sol) { controls.appendChild(sol); }
    fs.parentNode.insertBefore(controls, fs.nextSibling);

    btn.addEventListener('click', function () {
      var picked = Array.prototype.map.call(
        fs.querySelectorAll('input:checked'),
        function (el) { return el.value; });
      var msg;
      var correct = false;
      if (!picked.length) {
        msg = multi ? 'Select one or more answers first.'
                    : 'Select an answer first.';
      } else if (picked.length === answers.length &&
                 answers.every(function (a) {
                   return picked.indexOf(a) !== -1;
                 })) {
        correct = true;
        msg = 'Correct!';
      } else if (multi) {
        var missing = answers.some(function (a) {
          return picked.indexOf(a) === -1;
        });
        msg = missing
          ? "You haven't selected all the correct answers. Try again."
          : 'At least one of your selections is incorrect. Try again.';
      } else {
        msg = 'Not quite. Try again.';
      }
      // On a correct answer the visible "Correct!" is folded into the first
      // line of the solution so the explanation reads as one sentence flow;
      // the status line still gets the text, visually hidden, so screen
      // readers hear the announcement.
      if (correct && sol) {
        var first = sol.querySelector('p');
        if (first && !sol.hasAttribute('data-prefixed')) {
          var lead = document.createElement('em');
          lead.textContent = 'Correct! ';
          first.insertBefore(lead, first.firstChild);
          sol.setAttribute('data-prefixed', '');
        }
        fb.classList.add('mcq-visually-hidden');
        // Inline styles too, so a stale cached stylesheet cannot show the
        // status line alongside the inline "Correct!".
        fb.style.position = 'absolute';
        fb.style.width = '1px';
        fb.style.height = '1px';
        fb.style.overflow = 'hidden';
        fb.style.clipPath = 'inset(50%)';
        fb.style.whiteSpace = 'nowrap';
      } else {
        fb.classList.remove('mcq-visually-hidden');
        fb.style.position = '';
        fb.style.width = '';
        fb.style.height = '';
        fb.style.overflow = '';
        fb.style.clipPath = '';
        fb.style.whiteSpace = '';
      }
      fb.textContent = msg;
      if (sol) {
        sol.hidden = !correct;
        arrow.textContent = correct ? '▾' : '▸';
      }
    });
  }

  function init() {
    Array.prototype.forEach.call(
      document.querySelectorAll('div.mcq[data-answer]'), enhance);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
