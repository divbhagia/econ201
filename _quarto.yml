project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "content/*.qmd"
    - "practice/*.qmd"
    - "slides/*.qmd"
  resources:
    - syllabus/Econ201-Syllabus.pdf
    # Tagged-PDF slide decks built by `make slides-pdf`
    - "slides/*.pdf"
    # Tagged worksheet PDFs built by `make worksheets`
    - "worksheets/*.pdf"
    # Tagged lecture notes
    - "notes/*.pdf"

# Speaker notes are stripped from everything published to docs/.
# Build a presenter copy with: -M strip-notes:false
strip-notes: true

execute:
  freeze: auto

website:
  title: "Principles of Microeconomics"
  navbar:
    right:
      - text: "Home"
        file: index.qmd
      - text: "Syllabus"
        file: syllabus.qmd
      - text: "Schedule"
        file: schedule.qmd
      - text: "Content"
        file: content/the-big-picture.qmd
      - icon: github
        href: https://divbhagia.github.io/econ201/
        aria-label: GitHub repository for this course

  sidebar:
    - title: "Content"
      style: "docked"
      search: false
      contents:
        - text: "I. The Big Picture"
          file: content/the-big-picture.qmd
        - text: "II. The Economist's Toolkit"
          file: content/economists-toolkit.qmd
        - text: "III. Firms as Price Setters"
          file: content/firms-as-price-setters.qmd
        - text: "IV. Markets with Many Buyers and Sellers"
          file: content/markets-with-many-buyers-and-sellers.qmd
        - text: "V. Market Successes and Failures"
          file: content/market-successes-and-failures.qmd
        - text: "VI. Review"
          file: content/review.qmd

  page-footer:
      2026 Div Bhagia | [CC BY-NC 4.0 License](https://creativecommons.org/licenses/by-nc/4.0/) | [Accessibility](/accessibility.qmd) | Made with [Quarto](https://quarto.org/)

format:
  html:
    theme: assets/custom.scss
    toc: true
    link-external-newwindow: true
    css: assets/styles.css
    # Makes equations that overflow a narrow viewport scrollable and
    # keyboard-reachable (WCAG 1.4.10, 2.1.1). Keep.
    include-after-body: assets/site-a11y.html
  revealjs:
    # 16:9 so the deck fills a projector instead of being pillarboxed, and a
    # moderate safe margin around the content.
    width: 1280
    height: 720
    margin: 0.08
    # Published decks link their assets so git stores each image once. Build a
    # self-contained copy with: -M embed-resources:true
    embed-resources: false
    pdf-separate-fragments: false
    navigation-mode: linear
    hash-type: number
    slide-number: true
    controls: true
    progress: true
    transition: fade
    transition-speed: fast
    center: false
    code-overflow: wrap
    highlight-style: a11y-light
    mathjax: true
    # Fixes reveal.js chrome that fails WCAG at runtime: zoom blocked by the
    # viewport meta, an unlabeled menu button, unfocusable menu panels. Keep.
    include-after-body: assets/slides-a11y.html
